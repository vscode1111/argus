  <!-- Shared bridge factory + dev shim. Classic scripts from /public so they run
       before the deferred React entry, which calls acquireVsCodeApi() on mount. -->
  <script src="/ws-bridge.js"></script>
  <script>
    // Dev-mode shim: connect to the selected Argus backend, refreshing
    // the nonce via XHR before each connect (it rotates on server restart). Only the
    // URL resolution and mock-suppression are dev-specific; reconnect/queue live in
    // ws-bridge.js (createArgusBridge).
    window.acquireVsCodeApi = function () {
      var params = new URLSearchParams(window.location.search);
      var dir = params.get('dir');
      var session = params.get('session');
      var nonce = params.get('nonce');
      // ?mock=1 isolates e2e mock tests: do not forward these data-query messages to
      // the live dev backend (their async replies would clobber injected mock data).
      var mock = params.get('mock') === '1';
      // Process kills and closeClient are here for a second reason beyond clobbering:
      // unsuppressed, a mock test that clicks the terminate/disconnect button would reach
      // the live backend and really kill a Claude CLI - or drop another worker's page -
      // on whoever's machine runs the suite.
      var MOCK_SUPPRESSED = { getProviders: 1, switchProvider: 1, saveProviderDefault: 1, providerResponse: 1, getSkills: 1, listSessions: 1, listAllSessions: 1, deleteSession: 1, resumeSession: 1, refreshSession: 1, loadEarlier: 1, getActiveSessions: 1, getAgentGraph: 1, getOrchestratorGoals: 1, getAuthStatus: 1, getModels: 1, getUsageInsights: 1, getUsageLimits: 1, readToolImage: 1, getBgTasks: 1, listCliProcesses: 1, killCliProcess: 1, killAllCliProcesses: 1, getSessionActivity: 1, getSessionStats: 1, getSubagentThread: 1, getWorkspaceChanges: 1, listClients: 1, closeClient: 1, mediaUrl: 1 };
      // Derive host from the page so a LAN device reaches the dev machine, not its own localhost.
      var host = window.location.hostname || 'localhost';
      var requestedPort = params.get('backendPort') || '';
      var useBackendPort = !mock && (host === 'localhost' || host === '127.0.0.1')
        && /^[1-9]\d{0,4}$/.test(requestedPort) && Number(requestedPort) <= 65535;
      var daemonPort = document.querySelector('meta[name="argus-backend-port"]')?.content;
      var backendHost = host + ':' + (useBackendPort ? requestedPort : (!mock && daemonPort) || '3001');

      function updateUrl() {
        var p = new URLSearchParams();
        if (dir) p.set('dir', dir);
        if (session) p.set('session', session);
        if (useBackendPort) p.set('backendPort', requestedPort);
        if (new URLSearchParams(window.location.search).get('view') === 'agents') p.set('view', 'agents');
        var hash = p.toString();
        if (window.location.search.slice(1) !== hash) {
          var newUrl = window.location.pathname + (hash ? '?' + hash : '');
          window.history.replaceState(null, '', newUrl);
        }
      }
      window.addEventListener('popstate', updateUrl);
      var auth = window.createArgusAuth('http://' + backendHost);
      // Returns false when there is nothing to connect with. A 401 means this peer is
      // remote and not logged in; a thrown request means the server is simply down,
      // which must NOT be reported as an auth problem.
      function refreshNonce() {
        try {
          var xhr = new XMLHttpRequest();
          var t = auth.token();
          xhr.open('GET', 'http://' + backendHost + '/nonce' + (t ? '?auth=' + encodeURIComponent(t) : ''), false);
          xhr.send();
          if (xhr.status === 200 && xhr.responseText) { nonce = xhr.responseText; auth.setRequired(false); return true; }
          if (xhr.status === 401) { auth.setRequired(true); return false; }
        } catch (e) {}
        return !!nonce;
      }
      function nextUrl() {
        if (!refreshNonce()) return null;
        var p = new URLSearchParams();
        if (nonce) p.set('nonce', nonce);
        if (dir) p.set('dir', dir);
        if (session) p.set('session', session);
        if (auth.token()) p.set('auth', auth.token());
        p.set('client', 'browser');
        return 'ws://' + backendHost + '/agent?' + p.toString();
      }

      var bridge = window.createArgusBridge({
        nextUrl: nextUrl,
        // getInfo also emits selection; unsolicited provider pushes must not
        // replace data injected by mock tests. Direct window events still work.
        acceptMessage: function (msg) {
          return !mock || ['providerSelection', 'providers', 'accountUsage', 'usageLimits', 'usageInsights', 'modelList'].indexOf(msg.type) === -1;
        }
      });
      window.argusLogin = function (user, password) {
        return auth.login(user, password).then(function (r) {
          if (r.ok) bridge.reconnectNow();
          return r;
        });
      };
      // The CLI assigns the id for a brand-new chat, so it arrives from the server
      // rather than from anything the user clicked - reflect it in the address bar
      // too, otherwise a new conversation cannot be shared or reloaded back into.
      window.addEventListener('message', function (e) {
        var m = e.data;
        if (m && m.type === 'sessionId' && m.id && m.id !== session) { session = m.id; updateUrl(); }
      });
      return {
        postMessage: function (msg) {
          if (mock && msg && msg.type === 'getAccountUsage') { console.log('[mock] suppressed', msg.type); return; }
          if (msg && msg.type === 'switchWorkspace') { dir = msg.dir; session = null; bridge.reconnectNow(); updateUrl(); return; }
          // Keep the deep-link session param in step with what the user is viewing,
          // so a WS reconnect re-attaches to the right session (or none after a new chat).
          if (msg && msg.type === 'newSession') { session = null; updateUrl(); }
          if (msg && msg.type === 'resumeSession' && msg.id) { session = msg.id; updateUrl(); }
          if (mock && msg && MOCK_SUPPRESSED[msg.type]) { console.log('[mock] suppressed', msg.type); return; }
          console.log('[-> agent]', msg);
          bridge.post(msg);
        }
      };
    };
  </script>
</head>

  <div id="root"><div class="app-loader"><div class="app-spinner"></div></div></div>
  <style>
    .app-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--vscode-editor-background, #1e1e1e);
    }
    .app-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--vscode-panel-border, #474747);
      border-top-color: var(--vscode-button-background, #0e639c);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <div id="dev-harness"></div>
  <script type="module" src="/src/index.dev.tsx"></script>
</body>
